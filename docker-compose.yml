version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: debugify
      POSTGRES_USER: debugify
      POSTGRES_PASSWORD: debugify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugify"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: services/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://debugify:debugify@postgres:5432/debugify
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/server:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    depends_on:
      - server
    volumes:
      - ./services/frontend:/app
      - /app/node_modules

volumes:
  postgres_data: